name: Functional tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  functional-tests:
    name: functional-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out functional tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: anarchygene/eugene-site-tests
          path: tests
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        run: npm ci
        working-directory: tests

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests

      - name: Serve site and wait for readiness
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory public >"$RUNNER_TEMP/site-server.log" 2>&1 &
          server_pid=$!
          echo "$server_pid" >"$RUNNER_TEMP/site-server.pid"

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/ >/dev/null; then
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/site-server.log" >&2
              exit 1
            fi

            sleep 1
          done

          echo "Site did not become ready within 30 seconds." >&2
          cat "$RUNNER_TEMP/site-server.log" >&2
          exit 1

      - name: Run functional tests
        run: npm test -- --reporter=html
        working-directory: tests
        env:
          BASE_URL: http://localhost:8000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 7